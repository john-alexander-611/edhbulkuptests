name: Post-Merge Prod Tests

on:
  repository_dispatch:
    types: [prod-deployed]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy to go live
        run: |
          for i in {1..30}; do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
              | jq -r '.[0].deploy.status')

            echo "Current deploy status: $status"

            if [ "$status" = "live" ]; then
              echo "Deploy is live"
              break
            fi

            if [ "$i" = "30" ]; then
              echo "Timed out waiting for deploy to go live"
              exit 1
            fi

            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14